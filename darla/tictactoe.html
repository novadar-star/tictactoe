<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacToe</title>
    <link rel="stylesheet" href="style.css">
    <!--google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&family=Special+Gothic+Condensed+One&display=swap" rel="stylesheet">
    </head>
<body>
    <h2>Tic Tac Toe</h2>
    <div class ="outer-gameboard">
    <div class="gameboard"></div>

    </div>

    <div class="control">
        <div class="textbox">
            <label for="player1">Player 1:</label> <input type="text" id="player1" placeholder="Darla">
            <label for="player2">Player 2:</label> <input type="text" id="player2" placeholder=" Timothy">
        </div>
        <div class="game-controls">
            <button id="start">Start</button>
            <button id="restart">Restart</button>
        </div>
    
    </div>
    <script src="app.js"></script>
</body>
</html>
