<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="icon" type="image/x-icon" href="./favicon.png">
    <div class="title">
        <h1>Tic Tac Toe</h1>
    </div>
    
</head>
<body>

    <!--DIALOG POP UP-->
    <div class = "popup">
    <div class="title">Choose your character!
    </div>

    </div>


    <div class="turn">
        <div class="counter-turn">
             <h4 class = "turn">Current Turn: </h4>
             <h5 id="message"></h5>
        </div>      
    </div>

    <!--LAYOUT BOARD-->
    <div class="outer-gameboard">
          <div class="gameboard">
    </div>
    </div>
  
    <!--controls-->
    <div class="control">
        <input type="text" id="player1" placeholder="Player 1 Name">
        <input type="text" id="player2" placeholder="Player 2 Name">

        <button id="start">START</button>
        <button id="restart">RESTART</button>
    </div>










    <script src = "tictactoe.js" defer></script>
</body>
</html>
<!--use arrays-->
