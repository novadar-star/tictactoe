<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="icon" type="image/x-icon" href="./favicon.png">
    <div class="title">
        <h1>Tic Tac Toe</h1>
    </div>
    
</head>
<body>
    <div class="turn">
        <div class="counter-turn">
             <h4>Current Turn: </h4>
        </div>
       
    </div>

    <div class="tictac">
    <div class="top">
        <button class="box">1</button>
        <button class="box">2</button>
        <button class="box">3</button>
    </div>
     <div class="middle">
        <button class="box">4</button>
        <button class="box">5</button>
        <button class="box">6</button>
    </div>
    <div class="bottom">
        <button class="box">7</button>
        <button class="box">8</button>
        <button class="box">9</button>
    </div>
    </div>
    <script src = "tictactoe.js"></script>
</body>
</html>
