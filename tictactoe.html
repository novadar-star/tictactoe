<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <link rel="stylesheet" href="style.css">
    <h1>Tic Tac Toe</h1>
    
</head>
<body>
    <div class="tictac">
    <div class="top">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
     <div class="middle">
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>
    <div class="bottom">
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
    </div>
    </div>
    <script src = "tictactoe.js"></script>
</body>
</html>
